<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<title>Night Train</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0f1b2d;--deep:#08121f;--panel:rgba(10,20,36,.84);--panel-2:rgba(16,29,49,.96);
  --line:rgba(232,226,210,.13);--line-2:rgba(232,226,210,.25);
  --ink:#ece6d6;--muted:#9ba7b9;--faint:#6f7c90;
  --amber:#f0a847;--amber-ink:#2a1a05;--holo:#7ad7e6;--red:#e8573f;--green:#5fd394;--yellow:#f4d35e;
  --display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',sans-serif;
  --ui:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--night:#0f1b2d;--deep:#08121f;--ink:#ece6d6;--muted:#9ba7b9;--panel:rgba(10,20,36,.84);--panel-2:rgba(16,29,49,.96)}}
:root[data-theme="dark"]{--night:#0f1b2d;--deep:#08121f;--ink:#ece6d6;--muted:#9ba7b9;--panel:rgba(10,20,36,.84);--panel-2:rgba(16,29,49,.96)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default;opacity:.42}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#boot{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:var(--night);color:var(--muted);font-size:15px;transition:opacity .6s}
#boot.done{opacity:0;pointer-events:none}
#fade{position:fixed;inset:0;z-index:80;background:#04080f;opacity:0;pointer-events:none;transition:opacity .45s}
#fade.on{opacity:1}

/* departure board */
.screen{position:fixed;inset:0;z-index:30;display:flex}
#menu{align-items:center;padding:calc(env(safe-area-inset-top,0px) + 20px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(24px,env(safe-area-inset-left,0px));background:linear-gradient(100deg,rgba(5,10,19,.9) 0%,rgba(5,10,19,.6) 36%,rgba(5,10,19,0) 66%)}
@media (max-width:720px){#menu{align-items:flex-end;justify-content:center;background:linear-gradient(0deg,rgba(5,10,19,.95) 0%,rgba(5,10,19,.72) 52%,rgba(5,10,19,0) 82%)}}
.board{width:min(540px,100%);background:linear-gradient(180deg,#0c1a2e 0%,#08121f 100%);border:1px solid var(--line);border-radius:8px;padding:22px 20px 14px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 24px 60px rgba(0,0,0,.5)}
.title{display:flex;flex-wrap:wrap;gap:.06em;margin:0 0 4px;font-family:var(--display);font-weight:800;font-size:clamp(42px,9vw,84px);line-height:1;color:var(--ink)}
.flap{position:relative;display:inline-block;min-width:.6em;padding:.05em .05em 0;text-align:center;background:linear-gradient(180deg,#1b2b46 0 50%,#132139 50% 100%);border-radius:.08em;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:rgba(3,7,14,.85)}
.flap.sp{background:none;box-shadow:none;min-width:.28em}
.flap.sp::after{display:none}
.tagline{margin:10px 0 18px;color:var(--muted);font-size:15px}
.bhead,.row{display:grid;grid-template-columns:62px minmax(0,1fr) 40px;align-items:center;gap:12px}
.bhead{padding:0 10px 6px 13px;color:var(--faint);font-size:12.5px;border-bottom:1px solid var(--line)}
.bhead span:last-child{justify-self:end}
.rows{display:flex;flex-direction:column}
.row{width:100%;text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);border-left:3px solid transparent;transition:background .15s}
.row:hover,.row:focus-visible{background:rgba(240,168,71,.08);border-left-color:var(--amber);outline:none}
.row .t{font-family:var(--display);font-weight:700;font-size:23px;color:var(--amber);letter-spacing:.02em}
.row .svc{min-width:0}
.row .svc b{display:block;font-weight:600;font-size:18px;color:var(--ink)}
.row .svc small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .plat{justify-self:end;display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--line-2);border-radius:4px;font-family:var(--display);font-weight:700;font-size:18px}
.bfoot{display:flex;justify-content:space-between;gap:12px;padding:10px 10px 0 13px;color:var(--faint);font-size:12.5px}
#pause{align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(4,9,17,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#pause .title{font-size:clamp(38px,7vw,60px)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(3,7,14,.62);padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet{width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 12px 18px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:28px}
.sheet-body{overflow:auto;padding:12px 18px 18px;-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border:1px solid var(--line-2);border-radius:6px;font-weight:600;font-size:14.5px;background:rgba(255,255,255,.03);white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(255,255,255,.08)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.primary:hover:not(:disabled){background:#f6b862}
.btn.danger{color:#ffb4a6;border-color:rgba(232,87,63,.5)}
.btn.mini{min-height:32px;padding:5px 10px;font-size:13px}
.note{color:var(--muted);font-size:13.5px;margin:4px 0 12px}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:rgba(255,255,255,.02)}
.slot h3{margin:0 0 2px;font-size:16px;font-weight:600}
.slot p{margin:0;color:var(--muted);font-size:13.5px}
.slot .acts{display:flex;gap:8px}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row label,.set-row .lab{font-weight:600}
.set-row small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{padding:7px 11px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink)}
input[type=range]{width:min(190px,40vw);accent-color:var(--amber)}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;align-items:center;margin-bottom:6px}
.keys h4{grid-column:1/-1;margin:14px 0 0;font-size:15px}
kbd{display:inline-block;min-width:28px;padding:3px 7px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;font-family:var(--ui);font-weight:600;font-size:13px;text-align:center;background:rgba(255,255,255,.04)}

/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud .hp,#hud button{pointer-events:auto}
.hp{background:var(--panel);border:1px solid var(--line);border-radius:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#h-next{position:absolute;left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);padding:9px 14px 11px;width:min(300px,calc(100vw - 190px))}
#h-next .lbl{color:var(--muted);font-size:12.5px}
#h-next .name{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#h-next .meta{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:3px;font-size:13.5px;color:var(--muted)}
#h-next .meta b{color:var(--ink);font-weight:600}
.late{color:#ffb4a6!important}.ontime{color:var(--green)!important}
.sg{margin-top:8px}
.sg-bar{position:relative;height:8px;border-radius:4px;background:rgba(255,255,255,.08)}
.sg-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--holo)}
.sg-mark{position:absolute;left:85%;top:-3px;bottom:-3px;width:3px;margin-left:-1px;border-radius:1px;background:#6aa8ff}
.sg-txt{margin-top:4px;font-size:13px;color:var(--muted)}
.sg-txt b{color:var(--ink)}
#h-tr{position:absolute;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;align-items:center;gap:8px}
.chip{padding:8px 11px;font-weight:600;font-size:14px;white-space:nowrap}
#h-clock{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.03em;padding:6px 11px}
.iconbtn{width:42px;height:42px;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px;fill:var(--ink)}
#reqs{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:8px;width:min(330px,calc(100vw - 24px))}
@media (max-width:900px){#reqs{top:calc(env(safe-area-inset-top,0px) + 132px);left:auto;right:calc(env(safe-area-inset-right,0px) + 12px);transform:none;width:min(300px,calc(100vw - 24px))}}
.req{padding:10px 12px 11px;border-left:3px solid var(--holo);pointer-events:auto}
.req .who{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12.5px}
.req q{display:block;margin:2px 0 7px;font-size:15px;color:var(--ink)}
.req .tbar{height:3px;margin-bottom:8px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.req .tbar i{display:block;height:100%;background:var(--holo)}
.req .opts{display:flex;gap:6px;flex-wrap:wrap}
.req .opts button{flex:1 1 auto;min-height:34px;padding:6px 8px;border:1px solid var(--line-2);border-radius:6px;font-size:13px;font-weight:600;background:rgba(255,255,255,.04)}
.req .opts button:hover:not(:disabled){background:rgba(122,215,230,.14)}
.req .opts kbd{min-width:0;padding:0 4px;margin-right:4px;font-size:11px;border-bottom-width:1px}
.req.wrong{animation:shake .35s}
.req.done{border-left-color:var(--green);opacity:.85}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#toast{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);max-width:min(460px,calc(100vw - 32px));padding:10px 16px;text-align:center;font-weight:600;font-size:15px;opacity:0;transition:opacity .35s;pointer-events:none!important}
#toast.show{opacity:1}
#toast.warn{border-color:rgba(244,211,94,.5);color:var(--yellow)}
#toast.bad{border-color:rgba(232,87,63,.6);color:#ffb4a6}
#toast.good{border-color:rgba(95,211,148,.5);color:#b6f0cf}
#cluster{position:absolute;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:238px;padding:8px 12px 10px}
#gauge{display:block;width:100%;height:auto;overflow:visible}
.spd{position:absolute;left:0;right:0;top:44px;text-align:center;pointer-events:none}
.spd b{display:block;font-family:var(--display);font-weight:800;font-size:50px;line-height:1;font-variant-numeric:tabular-nums}
.spd span{color:var(--muted);font-size:12.5px}
.cl-rows{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-top:2px;font-size:13px}
.cl-rows div{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--muted);white-space:nowrap}
.cl-rows b{color:var(--ink);font-weight:600}
.sigdot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#555}
.meter{flex:1;max-width:58px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.meter i{display:block;height:100%;background:var(--holo)}
#h-adv{margin-top:7px;padding:5px 8px;border-radius:6px;text-align:center;font-weight:700;font-size:13.5px;background:rgba(255,255,255,.05);color:var(--muted)}
#h-adv.warn{background:rgba(244,211,94,.16);color:var(--yellow)}
#h-adv.bad{background:rgba(232,87,63,.22);color:#ffb4a6}
#h-adv.good{background:rgba(95,211,148,.14);color:#b6f0cf}
#ctrl{position:absolute;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;align-items:flex-end;gap:10px}
#btns{display:grid;grid-template-columns:1fr;gap:8px}
.cbtn{width:58px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;font-size:11.5px;font-weight:600;color:var(--muted)}
.cbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cbtn.on{border-color:var(--holo);color:var(--holo)}
.cbtn.on svg{stroke:var(--holo)}
.cbtn.attn{border-color:var(--amber);color:var(--amber);animation:pulse 1.4s infinite}
.cbtn.attn svg{stroke:var(--amber)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(240,168,71,.22)}}
#lever{position:relative;width:88px;height:300px;touch-action:none;cursor:ns-resize}
.lv-track{position:absolute;left:31px;top:30px;bottom:14px;width:26px;border-radius:13px;border:1px solid var(--line-2);background:linear-gradient(180deg,rgba(240,168,71,.42) 0%,rgba(240,168,71,.08) 47%,rgba(255,255,255,.08) 50%,rgba(122,215,230,.10) 53%,rgba(122,215,230,.36) 94%,rgba(232,87,63,.75) 95%)}
.lv-n{position:absolute;left:24px;width:40px;height:2px;background:var(--line-2)}
#lv-thumb{position:absolute;left:12px;width:64px;height:24px;margin-top:-12px;border-radius:6px;background:linear-gradient(180deg,#ece6d6,#bdb6a6);box-shadow:0 2px 6px rgba(0,0,0,.5)}
#lv-thumb::before{content:"";position:absolute;left:12px;right:12px;top:50%;height:2px;margin-top:-1px;background:rgba(0,0,0,.35);box-shadow:0 -5px 0 rgba(0,0,0,.16),0 5px 0 rgba(0,0,0,.16)}
#lv-read{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:12.5px;font-weight:700;white-space:nowrap}
#report{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;width:min(400px,calc(100vw - 24px));max-height:calc(100% - 40px);overflow:auto;padding:16px 18px;pointer-events:auto}
#report h3{margin:0;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05}
#report .sub{margin:3px 0 12px;color:var(--muted)}
.ledger{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:14.5px}
.ledger span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ledger .tot{padding-top:7px;border-top:1px solid var(--line-2);font-weight:700;font-size:16px}
.neg{color:#ffb4a6}
.rep-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

@media (max-width:760px),(max-height:560px){
  #cluster{width:186px;padding:6px 10px 8px}
  .spd{top:33px}.spd b{font-size:39px}
  .cl-rows{font-size:12px;gap:3px 8px}
  .meter{max-width:40px}
  #lever{height:244px;width:78px}
  .lv-track{left:26px}#lv-thumb{left:8px}.lv-n{left:19px}
  .cbtn{width:52px;min-height:46px;font-size:11px}
  #h-next{padding:8px 12px 9px}
  #h-next .name{font-size:22px}
  #h-clock{font-size:17px}
}
@media (max-height:560px){
  #lever{height:196px}
  #btns{grid-template-columns:1fr 1fr}
  #reqs{top:calc(env(safe-area-inset-top,0px) + 12px)}
}

/* depot */
#depot{pointer-events:none;justify-content:flex-end;align-items:stretch;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
#depot .hp,#depot button{pointer-events:auto}
.dp-top{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100% - 480px)}
.dp-panel{width:min(450px,100%);display:flex;flex-direction:column;min-height:0}
.dp-head{padding:14px 16px 4px}
.dp-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:30px}
.dp-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
.tabs button{flex:1;padding:11px 4px 10px;font-weight:600;font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.dp-body{flex:1;min-height:0;overflow:auto;padding:4px 16px 12px;-webkit-overflow-scrolling:touch}
.dp-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.dp-cta small{display:block;color:var(--muted);font-size:12.5px}
.dp-cta b{font-weight:600}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item h4{margin:0;font-size:15.5px;font-weight:600}
.item p{margin:2px 0 0;color:var(--muted);font-size:13px}
.item .spec{display:block;margin-top:2px;color:var(--faint);font-size:12.5px}
.item .acts{display:flex;gap:6px}
.sec{margin:16px 0 0;font-size:13px;font-weight:600;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px;padding-top:12px}
.sw{padding:10px;border:1px solid var(--line);border-radius:8px;text-align:left}
.sw i{display:block;height:34px;border-radius:5px;margin-bottom:8px}
.sw[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.sw small{display:block;color:var(--muted);font-size:12.5px}
.stars{color:var(--amber);letter-spacing:1px}
.tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;font-size:11.5px;font-weight:600;background:rgba(122,215,230,.14);color:var(--holo);vertical-align:2px}
@media (max-width:760px){
  #depot{flex-direction:column;justify-content:flex-end}
  .dp-panel{width:100%;max-height:60%}
  .dp-top{max-width:none;right:12px}
  .dp-head{padding:10px 14px 2px}.dp-head h2{font-size:24px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="gl" tabindex="-1" aria-label="Night Train 3D view"></canvas>
<div id="boot">Laying the track…</div>
<div id="fade"></div>

<div id="hud" hidden>
  <div id="h-next" class="hp">
    <div class="lbl" id="h-lbl">Next stop</div>
    <div class="name" id="h-name">—</div>
    <div class="meta"><span id="h-dist"></span><span id="h-due"></span><span id="h-delta"></span></div>

const SET=Object.assign({quality:isTouch?'medium':'high',master:0.8,music:0.45,sfx:0.9,units:'kmh',sens:1,guide:true,autoWarp:true},lsGet(SKEY)||{});

const SLOT_IDS=['slot1','slot2','slot3','auto'];
const slotName=id=>id==='auto'?'Autosave':'Slot '+id.slice(4);
const Saves={
  data:lsGet(VKEY)||{},ref:null,writing:false,pending:false,cloud:false,
  get(id){const r=this.data[id];return r&&!r.deleted?r:null;},
  put(id,rec){this.data[id]=rec;lsSet(VKEY,this.data);this.push();},
  del(id){this.data[id]={deleted:true,savedAt:Date.now()};lsSet(VKEY,this.data);this.push();},
  latest(){let best=null;for(const id of SLOT_IDS){const r=this.get(id);if(r&&(!best||r.savedAt>best.rec.savedAt))best={id,rec:r};}return best;},
  any(){return SLOT_IDS.some(id=>this.get(id));},
  async initCloud(){
    try{
      if(!window.claude||typeof window.claude.use!=='function')return;
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(!db||!user)return;
      const uid=await user.id();if(!uid)return;
      this.ref=db.doc('data/users/'+uid+'/saves');
      const snap=await this.ref.get();
      const remote=snap.exists?((snap.data()||{}).slots||{}):{};
      let changed=false,push=false;
      for(const id of SLOT_IDS){
        const r=remote[id],l=this.data[id];
        if(r&&(!l||r.savedAt>l.savedAt)){this.data[id]=r;changed=true;}
        else if(l&&(!r||l.savedAt>r.savedAt))push=true;
      }
      if(changed)lsSet(VKEY,this.data);
      this.cloud=true;
      if(push)this.push();
      UI.savesChanged();
    }catch(e){this.ref=null;this.cloud=false;}
  },
  push(){
    if(!this.ref)return;
    if(this.writing){this.pending=true;return;}
    this.writing=true;
    const body={slots:JSON.parse(JSON.stringify(this.data)),updatedAt:Date.now()};
    this.ref.set(body).catch(()=>{}).then(()=>{this.writing=false;if(this.pending){this.pending=false;this.push();}});
  }
};

/* ================= audio ================= */
const AU={
  ctx:null,ok:false,
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    let c;try{c=this.ctx=new AC();}catch(e){return;}
    this.master=c.createGain();this.master.connect(c.destination);

    const vg=c.createGain();vg.gain.value=0.65;this.verb.connect(vg);vg.connect(this.mus);
    const sv=c.createGain();sv.gain.value=0.25;this.verb.connect(sv);sv.connect(this.sfx);

    this.hiss=mk(this.white,'bandpass',1500,0.6);
    this.wind=mk(this.white,'lowpass',500,0.5);
    this.sq=mk(this.white,'bandpass',3400,9);
    const osc=(type,f)=>{const o=c.createOscillator();o.type=type;o.frequency.value=f;return o;};
    this.m1=osc('sawtooth',60);this.m2=osc('sine',120);
    this.mf=c.createBiquadFilter();this.mf.type='lowpass';this.mf.frequency.value=700;this.mg=c.createGain();this.mg.gain.value=0;
    this.m1.connect(this.mf);this.m2.connect(this.mf);this.mf.connect(this.mg);this.mg.connect(this.sfx);this.m1.start();this.m2.start();
    this.h1=osc('sine',55);this.h2=osc('sine',110.6);this.hg=c.createGain();this.hg.gain.value=0;this.h1.connect(this.hg);this.h2.connect(this.hg);this.hg.connect(this.sfx);this.h1.start();this.h2.start();
    this.ok=true;this.applyVol();this.startMusic();
  },
  impulse(sec){const c=this.ctx,n=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6);}return b;},
  noise(brown){const c=this.ctx,n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;if(brown){l=(l+0.02*w)/1.02;d[i]=l*3.5;}else d[i]=w;}return b;},
  applyVol(){if(!this.ok)return;const t=this.ctx.currentTime;this.master.gain.setTargetAtTime(SET.master,t,0.05);this.sfx.gain.setTargetAtTime(SET.sfx,t,0.05);this.mus.gain.setTargetAtTime(SET.music*0.5,t,0.2);},
  set(p,v,tc){if(!this.ok)return;p.setTargetAtTime(v,this.ctx.currentTime,tc||0.08);},
  update(st){
    if(!this.ok)return;
    const v=st.v,cab=st.cab?0.55:1,run=st.active?1:0;
    this.set(this.rum.g.gain,run*clamp(v/30,0,1)*0.55*cab+run*0.04);
    this.set(this.rum.f.frequency,70+v*2.4);
    this.set(this.hiss.g.gain,run*Math.pow(clamp(v/60,0,1),1.6)*0.11*cab);
    this.set(this.hiss.f.frequency,900+v*22);
    this.set(this.wind.g.gain,run*Math.pow(clamp(v/70,0,1),2)*(st.cab?0.06:0.2));
    this.set(this.mg.gain,run*(0.012+st.power*0.05)*(st.cab?1:0.6));
    this.set(this.m1.frequency,38+v*5.2);this.set(this.m2.frequency,76+v*10.4);
    this.set(this.mf.frequency,300+st.power*900+v*6);
    this.set(this.hg.gain,run*(0.018+st.power*0.02+st.mag*0.03));
    this.set(this.h2.frequency,110.6+st.mag*40);
    this.set(this.sq.g.gain,run*(st.squeal>0?st.squeal*0.05:0),0.05);
  },
  burst(f,q,dur,vol,type,delay){

  },

  announce(){[[523,0],[659,0.22],[784,0.44],[1046,0.66]].forEach(([f,d])=>this.tone(f,1.1,0.06,'sine',d));},
  good(){this.tone(880,0.25,0.05,'sine');this.tone(1320,0.4,0.04,'sine',0.09);},

  const lm=tr.units[0].g.matrix;const cab=CAM.mode==='cab';
  tr.loco.ext.visible=!cab;if(tr.loco.cab)tr.loco.cab.visible=cab;cabLight.intensity=cab?0.35:0;
  const near=cab?0.1:0.3;if(CAM.near!==near){CAM.near=near;camera.near=near;camera.updateProjectionMatrix();}
  if(cab){
    _cp.set(-0.55,3.2,-7.05).applyMatrix4(lm);camera.position.copy(_cp);
    _cq.setFromRotationMatrix(lm);_ce.set(CAM.pitch,CAM.yaw,0);_cq2.setFromEuler(_ce);camera.quaternion.copy(_cq).multiply(_cq2);
    if(tr.loco.handle&&G.j){tr.loco.handle.rotation.x=-G.j.lever*0.6;}
    return;
  }
  const idx=CAM.mode==='menu'?Math.min(2,tr.units.length-1):CAM.mode==='depot'?Math.floor(tr.units.length/2):0;
  const tm=tr.units[idx].g.matrix.elements;_ct.set(tm[12],tm[13]+2.1,tm[14]);
  const fx=-tm[8],fz=-tm[10],fl=Math.hypot(fx,fz)||1,hx=fx/fl,hz=fz/fl;
  if(CAM.mode==='side'){
    const T=G.T,v=G.j?G.j.v:0;
    if(!CAM.tsS||head>CAM.tsS+140||CAM.tsS>head+2600){CAM.tsS=head+240+v*7;CAM.tsSide=Math.random()<0.55?-1:1;}
    T.pt(CAM.tsS,CAM.tsSide<0?-13.5:18,0,_P);camera.position.set(_P.x,_P.y+2.3,_P.z);
    _cp.set(tm[12],tm[13]+1.8,tm[14]);lookAtLocal(_cp);return;
  }
  const az=CAM.mode==='menu'?1.95+CAM.menuT*0.035:CAM.az,el=CAM.mode==='menu'?0.13:CAM.el,dist=CAM.mode==='menu'?34:CAM.dist;
  const cd=dist*Math.cos(el);
  camera.position.set(_ct.x+(Math.sin(az)*(-hz)+Math.cos(az)*(-hx))*cd,Math.max(_ct.y+dist*Math.sin(el),tm[13]+0.9),_ct.z+(Math.sin(az)*hx+Math.cos(az)*(-hz))*cd);
  lookAtLocal(_ct);
}
function camCmd(){const i=CAM_MODES.indexOf(CAM.mode);CAM.mode=CAM_MODES[(i+1)%CAM_MODES.length];CAM.tsS=0;camera.fov=62;camera.updateProjectionMatrix();if(CAM.mode==='chase'){CAM.az=2.5;CAM.el=0.16;CAM.dist=46;}UI.toast(CAM_NAMES[CAM.mode]+' view');}

const keys={};
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;AU.init();const k=e.code;
  if(k==='Escape'||k==='KeyP'){e.preventDefault();if(!$('sheet').hidden){UI.closeSheet();return;}togglePause();return;}
  if(/^Digit[1-9]$/.test(k)&&$('sheet').hidden){const n=+k.slice(5);if(G.mode==='menu'){UI.menuKey(n);return;}if(G.paused){UI.pauseKey(n);return;}}
  if(G.mode!=='drive'||G.paused||!$('sheet').hidden)return;
  if(['ArrowUp','ArrowDown','Space'].includes(k))e.preventDefault();
  if(e.repeat&&k!=='KeyW'&&k!=='KeyS'&&k!=='ArrowUp'&&k!=='ArrowDown')return;
  keys[k]=true;const j=G.j;
  switch(k){case'KeyD':doorsCmd();break;case'KeyH':hornOn(true);break;case'KeyM':magCmd();break;case'KeyT':warpCmd(1);break;case'KeyG':warpCmd(-1);break;case'KeyC':camCmd();break;
    case'KeyB':j.lever=-1;break;case'KeyX':j.lever=0;break;case'Digit1':case'Digit2':case'Digit3':answerKey(+k.slice(5)-1);break;case'Enter':if(!$('report').hidden){const b=$('report').querySelector('[data-act]');if(b)b.click();}break;}
});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='KeyH')hornOn(false);});

function leverKeys(rdt){const j=G.j;let d=0;if(keys.KeyW||keys.ArrowUp)d+=1;if(keys.KeyS||keys.ArrowDown)d-=1;if(!d){G.detent=0;return;}if(G.detent>0){G.detent-=rdt;return;}const nl=clamp(j.lever+d*0.55*rdt,-1,1);if((j.lever>0&&nl<0)||(j.lever<0&&nl>0)){j.lever=0;G.detent=0.35;}else j.lever=nl;}

  $('g-v').setAttribute('stroke-dasharray',`${clamp(spd/max,0,1)*100} 100`);
  $('g-v').setAttribute('stroke',j.v>tg.cur/3.6+0.9?'#e8573f':'#7ad7e6');
  const lim=tg.cur*lf;$('h-lim').textContent=Math.round(lim);$('g-lim').setAttribute('transform',`rotate(${(90-(190-200*clamp(lim/max,0,1))).toFixed(1)} 110 110)`);
  const tgt=tg.bind&&tg.req>0.05?tg.bind:tg.near;
  if(tgt&&tgt.d<6000){$('g-tgt').setAttribute('opacity','1');$('g-tgt').setAttribute('transform',`rotate(${(90-(190-200*clamp(tgt.v*lf/max,0,1))).toFixed(1)} 110 110)`);
    const dist=tgt.d>=1000?(mph?(tgt.d/1609).toFixed(1)+' mi':(tgt.d/1000).toFixed(1)+' km'):Math.max(0,Math.round(tgt.d))+' m';
    $('h-tgt').textContent=(tgt.kind==='stop'?'Stop':tgt.kind==='signal'?'Red':Math.round(tgt.v*lf))+' in '+dist;}
  else{$('g-tgt').setAttribute('opacity','0');$('h-tgt').textContent='Clear';}
  const gr=T.at(j.s-G.P.len/2,_P).gr*100;$('h-grd').textContent=(gr>0.05?'+':gr<-0.05?'−':'')+Math.abs(gr).toFixed(1)+'%';
  $('h-sleep').style.width=j.sleep+'%';$('h-sleep').style.background=j.sleep<50?'var(--red)':j.sleep<80?'var(--yellow)':'var(--holo)';
  $('h-heat').style.width=clamp((j.heat-20)/80*100,0,100)+'%';$('h-heat').style.background=j.hot?'var(--red)':j.heat>85?'var(--yellow)':'var(--holo)';
  let sg=null;for(const g of T.sigs){if(g.s>j.s){if(g.s<j.s+3000)sg=g;break;}}
  $('h-sig').style.background=sg?(sg.aspect==='R'?'var(--red)':sg.aspect==='Y'?'var(--yellow)':'var(--green)'):'#3a4352';
  $('h-sig').style.boxShadow=sg?'0 0 8px '+(sg.aspect==='R'?'#e8573f':sg.aspect==='Y'?'#f4d35e':'#5fd394'):'none';
  // next stop panel
  const sgEl=$('h-sg');let showSg=false;
  if(j.phase==='board'||j.phase==='ready'){
    const S=T.stations[j.at];$('h-lbl').textContent=j.phase==='board'?'Boarding at':'Ready to depart';$('h-name').textContent=S.name;
    $('h-dist').innerHTML=`Departs <b>${fmtClock(T.dep[j.at])}</b>`;$('h-due').textContent=j.phase==='board'?`${Math.round(j.boardP*100)}% boarded`:(j.depOK?'Signal clear':'Waiting for signal');$('h-delta').textContent='';
    if(j.phase==='board'){showSg=true;$('h-sgf').style.width=(j.boardP*100)+'%';$('h-sgt').innerHTML=`${j.boardN} passengers boarding`;}
  }else if(j.phase==='run'){
    const S=T.stations[j.next],d=S.stop-j.s;$('h-lbl').textContent='Next stop';$('h-name').textContent=S.name;
    $('h-dist').innerHTML=`<b>${d>=1000?(mph?(d/1609).toFixed(1)+' mi':(d/1000).toFixed(1)+' km'):Math.round(d)+' m'}</b>`;
    $('h-due').textContent='Due '+fmtClock(T.arr[j.next]);
    const eta=j.time+Math.max(0,d)/Math.max(j.v,22)+(d>3000?60:0),late=eta-T.arr[j.next],dl=$('h-delta');
    if(late<=60){dl.textContent='On time';dl.className='ontime';}else{dl.textContent=`+${Math.round(late/60)} min`;dl.className='late';}
    if(d<1500){showSg=true;const f=d>=0?85*(1-d/1500):85+15*Math.min(1,-d/40);$('h-sgf').style.width=f+'%';
      $('h-sgt').innerHTML=Math.abs(d)<0.6?'<b>On the mark</b>':d>0?`Stop mark in <b>${d<100?d.toFixed(1):Math.round(d)} m</b>`:`Past the mark by <b>${(-d).toFixed(1)} m</b>`;}
  }else{const S=T.stations[j.at];$('h-lbl').textContent='Terminus';$('h-name').textContent=S.name;$('h-dist').textContent='Journey complete';$('h-due').textContent='';$('h-delta').textContent='';}
  sgEl.hidden=!showSg;$('h-sg').querySelector('.sg-mark').style.display=j.phase==='run'?'':'none';
  // advice line
  const adv=$('h-adv');let a='',c='';const can=canOpenHere();
  if(j.eb){a='Emergency brake';c='bad';}
  else if(j.atp){a='ATP is braking';c='bad';}
  else if(j.phase==='board'){a=j.boardP<1?'Boarding':'Close the doors';c=j.boardP<1?'':'good';}
  else if(j.phase==='ready'){a=j.depOK?'Signal clear, apply power':'Waiting for departure time';c=j.depOK?'good':'';}
  else if(j.phase==='end'){a='Journey complete';c='good';}
  else if(can&&can!=='short'){a='Open the doors';c='good';}
  else if(can==='short'){a='Pull forward';c='warn';}
  else if(SET.guide&&tg.req>=0.68){a='Brake hard';c='bad';}
  else if(SET.guide&&tg.req>=0.42){a='Brake now';c='warn';}
  else if(j.v>tg.cur/3.6+0.9){a='Over the limit';c='warn';}
  else if(j.hot){a='Core overheating';c='bad';}
  else if(magOn()){a='Levitating';c='good';}
  else a=j.lever>0.01?'Powering':j.lever<-0.01?'Braking':'Coasting';
  if(adv.textContent!==a)adv.textContent=a;adv.className=c;
  // buttons and chips
  $('b-doors').classList.toggle('on',j.doors);$('b-doors').classList.toggle('attn',!!(can&&can!=='short')||(j.phase==='board'&&j.boardP>=1));
  $('b-mag').classList.toggle('on',!!j.mag);
  $('warp-l').textContent=G.warp<G.warpWant?`×${G.warp} of ${G.warpWant}`:`×${G.warp}`;$('b-warp').classList.toggle('on',G.warp>1);
  $('cam-l').textContent=CAM_NAMES[CAM.mode]||'Cab';
  $('h-cred').textContent=fmtC(G.prof.credits);$('h-clock').textContent=fmtClock(j.time);
};

/* ================= depot ================= */
UI.showDepot=()=>{
  const d=$('depot');
  d.innerHTML=`<div class="dp-top"><button class="hp btn" data-act="to-title">Title</button><button class="hp btn" data-act="pause-depot">Menu</button><div class="hp chip" id="dp-cred"></div><div class="hp chip" id="dp-rep"></div></div>
  <div class="dp-panel hp"><div class="dp-head"><h2>Vesper depot</h2><p id="dp-sub"></p></div>
  <div class="tabs" role="tablist">${[['train','Train'],['upgrades','Upgrades'],['livery','Livery'],['routes','Routes']].map(([k,l])=>`<button role="tab" data-act="tab" data-id="${k}" aria-selected="${G.tab===k}">${l}</button>`).join('')}</div>
  <div class="dp-body" id="dp-body"></div>
  <div class="dp-cta"><div><small>Next departure</small><b id="dp-dep"></b></div><button class="btn primary" data-act="depart">Depart</button></div></div>`;
  d.hidden=false;UI.depotRender();
};
UI.depotRender=()=>{
  const p=G.prof,P=perf(),def=ROUTE(p.route);if(!$('dp-body'))return;
  $('dp-cred').textContent=fmtC(p.credits);
  const st=Math.round(p.rep);$('dp-rep').innerHTML=`<span class="stars" aria-label="${p.rep.toFixed(1)} of 5 stars">${'★'.repeat(st)}${'☆'.repeat(5-st)}</span> ${p.rep.toFixed(1)}`;
  $('dp-sub').textContent=`${p.journeys} journeys, ${Math.round(p.km).toLocaleString('en-US')} km, ${p.pax.toLocaleString('en-US')} passengers so far`;
  $('dp-dep').textContent=`${def.name}, ${fmtClock(def.dep)} from ${def.stations[0]}`;
  document.querySelectorAll('#depot .tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.id===G.tab)));
  let h='';
  if(G.tab==='train'){
    h+=`<p class="note">${p.cars.length} cars, ${P.len.toFixed(1)} m over buffers, ${P.tons} t empty. Platforms are 420 m long, so ten cars is the limit.</p>`;
    h+=`<div class="item"><div><h4>Vesper fusion locomotive</h4><p>${UPG.core.levels[p.up.core].l}, 300 kN starting effort</p><span class="spec">18.98 m over buffers, 3.0 m wide, 4.53 m to the core fairing, 90 t, 1,250 mm wheels</span></div></div>`;
    p.cars.forEach((c,i)=>{const C=CARS[c];h+=`<div class="item"><div><h4>${i+1}. ${C.name}</h4><p>${C.berths?`${C.berths} berths in ${C.comp} compartments`:'Service car'}</p><span class="spec">26.4 m over buffers, 2.825 m wide, 4.05 m tall, ${C.mass} t, 920 mm wheels</span></div><div class="acts"><button class="btn mini" data-act="move-car" data-i="${i}" data-d="-1"${i===0?' disabled':''} aria-label="Move forward">↑</button><button class="btn mini" data-act="move-car" data-i="${i}" data-d="1"${i===p.cars.length-1?' disabled':''} aria-label="Move back">↓</button><button class="btn mini danger" data-act="sell-car" data-i="${i}"${p.cars.length<=1?' disabled':''}>Sell ${fmtC(C.cost*0.6)}</button></div></div>`;});
    h+='<p class="sec">Add a car</p>';
    CAR_ORDER.forEach(k=>{const C=CARS[k];h+=`<div class="item"><div><h4>${C.name}</h4><p>${C.desc}</p></div><div class="acts"><button class="btn mini primary" data-act="buy-car" data-id="${k}"${p.credits<C.cost||p.cars.length>=10?' disabled':''}>${fmtC(C.cost)}</button></div></div>`;});
  }else if(G.tab==='upgrades'){
    UPG_ORDER.forEach(k=>{const U=UPG[k],lv=p.up[k],nx=U.levels[lv+1];h+=`<div class="item"><div><h4>${U.name}</h4><p>${U.desc}</p><span class="spec">Now: ${U.levels[lv].l}${nx?`. Next: ${nx.l}`:''}</span></div><div class="acts">${nx?`<button class="btn mini primary" data-act="upgrade" data-id="${k}"${p.credits<nx.c?' disabled':''}>${fmtC(nx.c)}</button>`:'<span class="tag">Fully upgraded</span>'}</div></div>`;});
  }else if(G.tab==='livery'){
    h+='<div class="swatches">'+Object.entries(LIVERIES).map(([k,L])=>{const own=p.liveries.includes(k);const hex=n=>'#'+n.toString(16).padStart(6,'0');return `<button class="sw" data-act="${own?'livery':'buy-livery'}" data-id="${k}" aria-pressed="${p.livery===k}"${!own&&p.credits<L.cost?' disabled':''}><i style="background:linear-gradient(180deg,${hex(L.roof)} 0 22%,${hex(L.body)} 22% 68%,${hex(L.stripe)} 68% 76%,${hex(L.body)} 76%)"></i><b>${L.name}</b><small>${own?(p.livery===k?'In service':'Owned'):fmtC(L.cost)}</small></button>`;}).join('')+'</div>';
  }else{
    ROUTES.forEach(r=>{const own=p.routes.includes(r.id),km=r.legs.reduce((a,b)=>a+b,0);const tags=[r.mag?'Maglev':'',r.aurora>0.5?'Aurora':'',r.elevator?'Spaceport':''].filter(Boolean).map(t=>`<span class="tag">${t}</span>`).join('');
      h+=`<div class="item"><div><h4>${r.name}${tags}</h4><p>${r.desc}</p><span class="spec">${r.stations[0]} to ${r.stations[r.stations.length-1]}, ${r.stations.length} stations, ${km} km, line speed ${r.line} km/h, departs ${fmtClock(r.dep)}</span></div><div class="acts">${own?(p.route===r.id?'<span class="tag">Selected</span>':`<button class="btn mini" data-act="route" data-id="${r.id}">Select</button>`):`<button class="btn mini primary" data-act="buy-route" data-id="${r.id}"${p.credits<r.cost?' disabled':''}>${fmtC(r.cost)}</button>`}</div></div>`;});
  }
  $('dp-body').innerHTML=h;
};
function spend(c){if(G.prof.credits<c){UI.toast('Not enough credits yet.','warn');return false;}G.prof.credits-=c;AU.good();return true;}
function depotChanged(){UI.depotRender();clearTimeout(G.saveT);G.saveT=setTimeout(autosave,700);}
function trainChanged(){setTrain(G.prof.cars,G.prof.livery);CAM.dist=Math.max(38,G.train.len*0.5);depotChanged();}

/* ================= actions ================= */
UI.act=(a,el)=>{
  AU.init();AU.click();const p=G.prof,ds=el?el.dataset:{};
  switch(a){
    case'continue':{const lt=Saves.latest();if(lt)loadSave(lt.id);break;}
    case'new':UI.openSlots('new');break;
    case'load':UI.openSlots('load');break;
    case'save':UI.openSlots('save');break;
    case'settings':UI.openSettings();break;
    case'controls':UI.openControls();break;
    case'sheet-close':UI.closeSheet();break;
    case'resume':togglePause(false);break;
    case'quit':autosave();UI.fade(()=>enterMenu());break;
    case'pause-depot':togglePause(true);break;
    case'slot-load':loadSave(ds.id);break;
    case'slot-del':if(ds.confirm){Saves.del(ds.id);UI.openSlots(UI._slotMode);if(G.mode==='menu')UI.showMenu(false);}else{ds.confirm='1';el.textContent='Tap again to delete';}break;
    case'slot-save':if(Saves.get(ds.id)&&!ds.confirm){ds.confirm='1';el.textContent='Tap again to overwrite';break;}G.slot=ds.id;writeSave(ds.id);UI.openSlots('save');UI.toast(`Saved to ${slotName(ds.id)}.`,'good');break;
    case'slot-new':if(Saves.get(ds.id)&&!ds.confirm){ds.confirm='1';el.textContent='Tap again to replace';break;}newGame(ds.id);break;
    case'set':{let v=ds.v;if(v==='true')v=true;else if(v==='false')v=false;SET[ds.k]=v;saveSettings();
      if(ds.k==='quality'){Q=QUAL[v]||QUAL.medium;renderer.setPixelRatio(Q.pr);renderer.setSize(innerWidth,innerHeight,false);scene.fog.density=Q.fog;}
      if(ds.k==='units'&&G.mode==='drive')UI.buildGauge();UI.openSettings();break;}
    case'doors':doorsCmd();break;
    case'mag':magCmd();break;
    case'warp':warpCmd(0);break;
    case'cam':camCmd();break;
    case'report-ok':$('report').hidden=true;break;
    case'finish':$('report').hidden=true;UI.fade(()=>finishJourney());break;
    case'req':RQ.answer(+ds.id,ds.a);break;
    case'tab':G.tab=ds.id;UI.depotRender();break;
    case'buy-car':if(p.cars.length>=10){UI.toast('Ten cars is the platform limit.','warn');break;}if(spend(CARS[ds.id].cost)){p.cars.push(ds.id);trainChanged();UI.toast(`${CARS[ds.id].name} added to the train.`,'good');}break;
    case'sell-car':{const i=+ds.i;if(p.cars.length<=1)break;p.credits+=Math.round(CARS[p.cars[i]].cost*0.6);p.cars.splice(i,1);trainChanged();break;}
    case'move-car':{const i=+ds.i,k=i+(+ds.d);if(k<0||k>=p.cars.length)break;[p.cars[i],p.cars[k]]=[p.cars[k],p.cars[i]];trainChanged();break;}
    case'upgrade':{const U=UPG[ds.id],nx=U.levels[p.up[ds.id]+1];if(nx&&spend(nx.c)){p.up[ds.id]++;depotChanged();UI.toast(`${U.name}: ${nx.l}.`,'good');}break;}
    case'livery':p.livery=ds.id;trainChanged();break;
    case'buy-livery':if(spend(LIVERIES[ds.id].cost)){p.liveries.push(ds.id);p.livery=ds.id;trainChanged();}break;
    case'route':p.route=ds.id;depotChanged();UI.fade(()=>enterDepot());break;
    case'buy-route':if(spend(ROUTE(ds.id).cost)){p.routes.push(ds.id);p.route=ds.id;depotChanged();UI.fade(()=>{enterDepot();UI.toast(`${ROUTE(ds.id).name} unlocked.`,'good');});}break;
    case'depart':UI.fade(()=>startJourney());break;
    case'to-title':autosave();UI.fade(()=>enterMenu());break;
  }
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(b.id==='b-doors'||b.id==='b-mag'||b.id==='b-warp'||b.id==='b-cam'){}UI.act(b.dataset.act,b);});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.set){SET[el.dataset.set]=parseFloat(el.value);saveSettings();AU.applyVol();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='drive'){if(!G.paused)togglePause(true);autosave();}});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

/* ================= main loop ================= */
function updateDrive(rdt){
  const j=G.j,P=G.P;
  leverKeys(rdt);readyNag();
  const tg=computeTargets();G.tg=tg;G.warp=Math.min(G.warpWant,warpCap(tg));
  const sim=rdt*G.warp,n=Math.max(1,Math.ceil(sim/0.05)),h=sim/n,prevS=j.s;
  for(let i=0;i<n;i++)physics(h);
  journeyLogic(sim,rdt,prevS,tg);
  RQ.update(rdt);
  j.door=clamp(j.door+(j.doors?1:-1)*rdt*0.9,0,1);trainDoors(G.train,j.door);
  if(G.warp<=2&&j.v>2){const cab=CAM.mode==='cab';for(const off of[3.24,6.24,12.74,15.74,22.2,24.7]){if(Math.floor((prevS-off)/26)!==Math.floor((j.s-off)/26)){AU.clack(j.v,cab);break;}}}
  G.autoT+=rdt;if(G.autoT>120&&j.phase!=='end')autosave();
}
const _hp={};
function step(rdt){
  const T=G.T;if(!T||!G.train)return;let head,clock,v;
  if(G.mode==='menu'){G.demo.t+=rdt;G.demo.s+=24*rdt;if(G.demo.s>T.L-7000){G.demo.s=6800;World.update(G.demo.s,true);}head=G.demo.s;clock=hm(23,20);v=24;CAM.menuT+=rdt;}
  else if(G.mode==='depot'){head=G.depot.s;clock=T.dep[0]-12*60;v=0;}
  else{if(!G.paused)updateDrive(rdt);head=G.j.s;clock=G.j.time;v=G.j.v;}
  placeTrain(G.train,T,head,G.t,v);
  T.at(head,_hp);setOrigin(_hp.x,_hp.z);
  World.update(head,false);World.updateSignals();
  updateCamera(rdt,head);camera.updateMatrixWorld();camera.getWorldPosition(_cv2);
  // stations: waiting passengers board, platform lights
  for(const st of World.stations.values()){if(!st.people)continue;let n=st.pcount;if(G.mode==='drive'){const j=G.j;if(st.k===j.at){n=j.phase==='board'?Math.round(st.pcount*(1-j.boardP)):0;}}st.people.count=n;if(st.holo)st.holo.position.y=16+Math.sin(G.t*0.8+st.k)*0.25;}
  const b=T.biomeAt(head);let nearSt=0;for(const S of T.stations){const d=Math.abs(S.s-head);if(d<4000)nearSt=Math.max(nearSt,1-d/4000);}
  const ev=G.j&&G.j.ev;const aur=Math.max(T.def.aurora*(0.4+0.6*Math.max(b.snow,0.3)),ev&&ev.kind==='aurora'?1.5:0);
  Sky.update(rdt,clock,_cv2,{city:clamp(b.city*0.9+nearSt*0.35,0,1.2),moonDir:T.moonDir,aurora:aur,elevator:T.def.elevator});
  if(ev&&ev.kind==='ring'){Sky.ring.material.uniforms.uI.value=2.2;}
  World.place(_cv2,_hp.y);updateGlows();
  if(G.mode==='drive'){
    const j=G.j;AU.update({v:G.paused?0:j.v,cab:CAM.mode==='cab',active:!G.paused,power:j.trac,mag:magOn()?1:0,squeal:(j.brk>0.3&&j.v>0.3&&j.v<6)?(1-j.v/6)*j.brk:0});
    drawLever();UI._hudT+=rdt;if(UI._hudT>0.08){UI._hudT=0;UI.hud();UI.reqs();UI.reqBars();}
  }else AU.update({v:G.mode==='menu'?24:0,cab:false,active:G.mode==='menu',power:0.2,mag:0,squeal:0});
}
let last=0;
function frame(now){
  requestAnimationFrame(frame);
  let rdt=(now-last)/1000;last=now;if(!(rdt>0))rdt=0.016;if(rdt>0.1)rdt=0.1;G.t+=rdt;
  try{step(rdt);}catch(err){console.error(err);}
  renderer.render(scene,camera);
}
function boot(){
  const t=$('toast');document.body.appendChild(t);t.style.position='fixed';t.style.zIndex='45';
  try{enterMenu();}catch(err){console.error(err);$('boot').textContent='Something went wrong while building the world. Reload to try again.';return;}
  requestAnimationFrame(n=>{last=n;requestAnimationFrame(frame);});
  setTimeout(()=>$('boot').classList.add('done'),350);
  Saves.initCloud();
  window.__nt={G,World,UI,SET,Saves,step,doorsCmd,RQ,togglePause,writeSave,loadSave,CAM,camCmd,computeTargets,ROUTES,buildRoute};
}
boot();
})();
</script>
